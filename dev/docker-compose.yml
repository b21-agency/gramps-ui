# Local Gramps Web backend (+ classic UI) seeded with the Gramps example tree.
# Usage: see dev/README.md
services:
  grampsweb:
    image: ghcr.io/gramps-project/grampsweb:latest
    restart: unless-stopped
    ports:
      - "5055:5000"
    environment: &env
      GRAMPSWEB_TREE: "Gramps Web"
      GRAMPSWEB_SECRET_KEY: "local-dev-secret-not-for-production"
      GRAMPSWEB_BASE_URL: "http://localhost:5055"
      GRAMPSWEB_CELERY_CONFIG__broker_url: "redis://redis:6379/0"
      GRAMPSWEB_CELERY_CONFIG__result_backend: "redis://redis:6379/0"
      GRAMPSWEB_RATELIMIT_STORAGE_URI: redis://redis:6379/1
      GUNICORN_NUM_WORKERS: 2
    depends_on: [redis]
    volumes: &vol
      - users:/app/users
      - index:/app/indexdir
      - thumbs:/app/thumbnail_cache
      - cache:/app/cache
      - secret:/app/secret
      - db:/root/.gramps/grampsdb
      - media:/app/media
      - tmp:/tmp

  grampsweb_celery:
    image: ghcr.io/gramps-project/grampsweb:latest
    restart: unless-stopped
    environment: *env
    volumes: *vol
    depends_on: [redis]
    command: celery -A gramps_webapi.celery worker --loglevel=INFO --concurrency=2

  redis:
    image: docker.io/library/redis:7.2.4-alpine
    restart: unless-stopped

volumes:
  users:
  index:
  thumbs:
  cache:
  secret:
  db:
  media:
  tmp:
